name: RHEL 10 tmate investigation

on:
  push:
    branches: [test-bootc-rhel10-tmate]

permissions:
  contents: read

jobs:
  investigate:
    name: RHEL 10 tmate investigation
    runs-on: rhel10-x86_64-16c-64g
    timeout-minutes: 30
    steps:
      - name: Bootstrap RHEL tools
        run: sudo dnf install -y git-core podman curl tar gzip gcc

      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Diagnose exact tmate binary
        run: |
          set -euo pipefail
          tmate_version=2.4.0
          tmate=/tmp/tmate/tmate
          socket=/tmp/tmate.sock
          rm -rf /tmp/tmate "$socket" /tmp/tmate.log /tmp/tmate.bashrc
          mkdir -p /tmp/tmate
          curl --fail --location --silent --show-error \
            "https://github.com/tmate-io/tmate/releases/download/${tmate_version}/tmate-${tmate_version}-static-linux-amd64.tar.xz" \
            -o /tmp/tmate.tar.xz
          tar x -C /tmp/tmate -f /tmp/tmate.tar.xz --strip-components=1
          rm /tmp/tmate.tar.xz
          printf 'binary=%s\n' "$tmate"
          "$tmate" -V
          file "$tmate"
          ldd "$tmate" || true

          printf '\nDNS and endpoint reachability (bounded):\n'
          getent ahosts ssh.tmate.io || true
          getent ahosts tmate.io || true
          timeout 10 bash -c '</dev/tcp/ssh.tmate.io/22' && echo 'ssh.tmate.io:22 tcp=reachable' || echo 'ssh.tmate.io:22 tcp=unreachable'
          timeout 10 curl --fail --silent --show-error --connect-timeout 5 --max-time 10 -o /dev/null -w 'https://tmate.io tls/http=%{http_code}\n' https://tmate.io/ || echo 'https://tmate.io tls/http=unreachable'

          # This is the exact non-secret configuration assembled by src/index.js.
          printf 'set +e\n' > /tmp/tmate.bashrc
          config='set-option -g default-command "bash --rcfile /tmp/tmate.bashrc" \\; new-session -d'
          printf 'Generated config: %s\n' "$config"
          tmate_args=(-S "$socket" -v set-option -g default-command 'bash --rcfile /tmp/tmate.bashrc' ';' new-session -d)
          "$tmate" "${tmate_args[@]}" >/tmp/tmate.start.out 2>/tmp/tmate.log &
          tmate_pid=$!
          cleanup() {
            "$tmate" -S "$socket" kill-session -a >/dev/null 2>&1 || true
            kill "$tmate_pid" >/dev/null 2>&1 || true
            wait "$tmate_pid" >/dev/null 2>&1 || true
            rm -f "$socket"
          }
          trap cleanup EXIT
          sleep 2
          set +e
          timeout --signal=TERM --kill-after=5s 30s "$tmate" -S "$socket" wait tmate-ready
          ready_rc=$?
          set -e
          printf 'tmate wait tmate-ready rc=%s (30-second bound)\n' "$ready_rc"
          printf 'tmate debug log summary:\n'
          timeout 5 grep -E '(^| )(error|warning|connect|server|ready)' /tmp/tmate.log | head -40 || true
          for format in '#{tmate_status}' '#{tmate_ssh}' '#{tmate_web}'; do
            set +e
            value=$(timeout 10 "$tmate" -S "$socket" display -p "$format" 2>/tmp/tmate.display.err)
            display_rc=$?
            set -e
            # Treat all connection strings as bearer secrets: mask before any output.
            if [[ "$format" != '#{tmate_status}' && -n "$value" ]]; then
              echo "::add-mask::$value"
              value='[masked]'
            fi
            printf '%s rc=%s value=%s\n' "$format" "$display_rc" "${value:-[empty]}"
          done

      - name: Terminate tmate session
        if: always()
        run: /tmp/tmate/tmate -S /tmp/tmate.sock kill-session -a || true
